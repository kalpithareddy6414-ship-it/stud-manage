<html>
<body>
<h2>Student Management System</h2>
Name: <input type="text" id="name"><br><br>

Roll No: <input type="text" id="roll"><br><br>
Email: <input type="email" id="email"><br><br>
Course:
<select id="course">
<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
<option>IT</option>
</select><br><br>

<button type="button" onclick="add()">Add Student</button>
<button type="button" onclick="clearData()">Clear</button>

<h3>Search Student</h3>
Search Roll No:
<input type="text" id="search">
<button type="button" onclick="searchStudent()">Search</button>

<p id="result"></p>
<hr>



<script>
function add() {
    let n = document.getElementById("name").value;
    let r = document.getElementById("roll").value;
    let e = document.getElementById("email").value;
    let c = document.getElementById("course").value;

    if(n=="" || r=="" || e=="") {
        alert("Fill all fields");
        return;
    }

    document.getElementById("result").innerHTML =
        "Student Added Successfully!<br>" +
        "Name: " + n + "<br>" +
        "Roll No: " + r + "<br>" +
        "Email: " + e + "<br>" +
        "Course: " + c;
}

function clearData() {
    document.getElementById("name").value="";
    document.getElementById("roll").value="";
    document.getElementById("email").value="";
    document.getElementById("result").innerHTML="";
}

function searchStudent() {
    if(document.getElementById("search").value == document.getElementById("roll").value &&
       document.getElementById("search").value!="") {
        alert("Student Found: " + document.getElementById("name").value);
    }
    else {
        alert("Student Not Found");
    }
}
</script>
</body>
</html>
